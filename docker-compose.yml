# Lokal ishlab chiqish uchun. Railway bu faylni ishlatmaydi (u Dockerfile'ni oladi).

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Tashkent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis_server
    restart: unless-stopped
    # Port tashqariga ochilmaydi — faqat ichki tarmoq

  web:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery hozircha ishlatilmayapti. Kerak bo'lsa kommentni oching:
  # celery:
  #   build: .
  #   container_name: celery_worker
  #   restart: unless-stopped
  #   command: python -m celery -A app.celery.celery worker --loglevel=info
  #   env_file:
  #     - .env
  #   environment:
  #     - DB_HOST=db
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     - redis
  #     - db

volumes:
  postgres_data:
